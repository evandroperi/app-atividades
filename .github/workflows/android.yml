name: Android → APK de teste e AAB da Play Store

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão que aparece na Play Store"
        required: true
        default: "1.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_VERSION_NAME: ${{ github.event.inputs.versao }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: APK de teste (instalar direto no celular)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Chave de envio da Play Store (se configurada)
        id: chave
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem ANDROID_KEYSTORE_B64: gerei só o APK de teste. O AAB da Play Store sai quando a chave de envio estiver configurada."
          else
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AAB assinado para a Play Store
        if: steps.chave.outputs.ok == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: anos-iniciais-apk-teste-${{ github.event.inputs.versao }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          name: anos-iniciais-play-${{ github.event.inputs.versao }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
